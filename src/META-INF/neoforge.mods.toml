[[mods]]
modId="airwaves"
version="0.1.0"
logoFile="logo.png"
displayName="Create: Airwaves"
description='''Real radio for your Create world.

Talk into a microphone, send your voice down the wire to a transmitter, and anyone with a radio on the same frequency hears you, with static that grows with distance, hills and storms.

- Transmitters and receivers in four sizes, with antenna masts that grow layer by layer
- Powered by rotation: every transmitter, relay and broadcast tower runs on Create stress
- Copper, gold, silver and fiber wires, glass insulators, utility poles and line pylons
- Relay towers and a 27-block Radio Tower for continent-wide stations
- Make your own circuit boards on the Circuit Workbench
- Radio Console for airship bridges, fully working on Create: Aeronautics
- Signal jammers, PA horns, On Air signs, tuning table and portable radio
- Built-in proximity voice chat, Ponder scenes, Engineer's Goggles info and a Field Manual

Release 0.1.0, build 9.9'''

